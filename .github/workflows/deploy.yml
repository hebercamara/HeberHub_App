name: Deploy

# Push na main publica no ambiente de testes (dev).
# Produção (prod) só sai pelo botão "Run workflow", escolhendo prod.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ inputs.ambiente || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cada ambiente do GitHub (Settings > Environments) se chama Firebase-<ambiente>
    # (Firebase-dev, Firebase-prod) e guarda:
    #   secret   FIREBASE_SERVICE_ACCOUNT  -> JSON da conta de serviço
    #   variáveis VITE_FIREBASE_*          -> configuração do app Web
    #   variável COORDENADOR_INICIAL_EMAIL -> e-mail da primeira coordenação
    environment: Firebase-${{ inputs.ambiente || 'dev' }}
    env:
      AMBIENTE: ${{ inputs.ambiente || 'dev' }}
    steps:
      - name: Conferir credencial
        id: credencial
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT ausente no ambiente $AMBIENTE. Deploy ignorado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.credencial.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.credencial.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json

      - name: Instalar dependências
        if: steps.credencial.outputs.ok == 'true'
        run: npm run install:all

      - name: Build
        if: steps.credencial.outputs.ok == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_APP_ENV: ${{ env.AMBIENTE }}
          VITE_USE_EMULATORS: 'false'
        run: npm run build

      # Parâmetros das Cloud Functions, lidos pelo Firebase no deploy.
      - name: Configurar funções
        if: steps.credencial.outputs.ok == 'true'
        env:
          PROJETO: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          COORDENADOR_INICIAL_EMAIL: ${{ vars.COORDENADOR_INICIAL_EMAIL }}
        run: echo "COORDENADOR_INICIAL_EMAIL=$COORDENADOR_INICIAL_EMAIL" > "functions/.env.$PROJETO"

      - uses: google-github-actions/auth@v3
        if: steps.credencial.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar no Firebase
        if: steps.credencial.outputs.ok == 'true'
        run: |
          set -o pipefail
          if ! npx firebase deploy --project "$AMBIENTE" --non-interactive --force 2>&1 | tee deploy.log; then
            # Resume o erro como anotação, visível no resumo da execução.
            resumo=$(grep -v '^\s*$' deploy.log | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falha no deploy::$resumo"
            exit 1
          fi
